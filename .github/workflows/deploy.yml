name: Deploy

# Provisions infra/main.bicep, builds the four images in Azure Container Registry
# and wires them into the Container Apps, using scripts/deploy.sh.
#
# Authentication is OpenID Connect (federated credential on an Entra app
# registration, see infra/README.md); the three values below are repository
# VARIABLES, not secrets. No secret is stored in GitHub.
#
# The Entra app registration for the demo login is created once by the owner
# (scripts/deploy.sh without --skip-auth); the CI identity has no Microsoft
# Graph permissions, so CI passes --skip-auth and reuses the existing
# registration through the deployed auth configuration.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment name (KAIROS_ENV, resource-group suffix)
        required: true
        default: dev
        type: string
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "services/**"
      - "config/**"
      - "infra/**"
      - "pyproject.toml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and deploy
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT_NAME: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (privacy scan of the build context)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Azure login (OIDC, no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision, build and deploy
        run: bash scripts/deploy.sh --env "$ENVIRONMENT_NAME" --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" --skip-auth
