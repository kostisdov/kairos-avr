    gradual_stenotic:
      description: "Rising gradient with falling area over years; measurement noise about 3 mmHg; competing mortality by age."
      evaluates: "Whether serial echo adds to baseline; calibration of 1-, 3- and 5-year SVD-before-death."
      overrides:
        phenotype.p_regurgitant: {value: {SAVR: 0.0, TAVR: 0.0}, label: varied}
    regurgitant_abrupt:
      description: "Leaflet tear with little preceding gradient signal; regurgitant endpoint without area criteria."
      evaluates: "Whether the model correctly reports low predictability and the reliability statement flags it; phenotype-specific calibration."
      overrides:
        phenotype.p_regurgitant: {value: {SAVR: 0.6, TAVR: 0.5}, label: varied}
    high_competing_mortality:
      description: "Elderly TAVI-like cohort; death hazard several times the SVD hazard."
      evaluates: "Whether the three probabilities are reported correctly and the complement is never misread."
      overrides:
        p_tavr: {value: 0.9, label: varied}
        age_at_implant: {value: {SAVR: [80, 5], TAVR: [84, 5]}, label: varied}
        death_hazard.multiplier: {value: 2.5, label: varied}
    irregular_surveillance:
      description: "Informative visit process; 25 to 35% missing at five years; interval-censored onset."
      evaluates: "Detection versus onset bias; overdue flag behaviour; sensitivity analyses."
      overrides:
        surveillance.p_missed_visit: {value: 0.28, label: literature_informed, source: "five-year echo follow-up missing in 30.4% of TAVR and 35.7% of surgical patients (PARTNER 3 five-year report)"}
        surveillance.informative: {value: true, label: varied}
    biomarker_information:
      description: "Three versions of the biomarker module effect (meaningful, weak, absent) plus a marker essentially unmeasured."
      evaluates: "Whether incremental Brier and calibration gains appear only where information exists, and whether the pipeline degrades gracefully when a marker is absent."
      variants:
        meaningful:
          description: "Biomarker effects at their literature-informed size."
          overrides:
            svd_hazard.biomarker_effect_multiplier: {value: 1.0, label: varied}
        weak:
          description: "Biomarker effects at 30% of their literature-informed size."
          overrides:
            svd_hazard.biomarker_effect_multiplier: {value: 0.3, label: varied}
        absent:
          description: "Biomarkers carry no information about SVD."
          overrides:
            svd_hazard.biomarker_effect_multiplier: {value: 0.0, label: varied}
        unmeasured:
          description: "Meaningful effects, but Lp(a) and phosphate are essentially unmeasured; the module must switch off rather than impute."
          overrides:
            svd_hazard.biomarker_effect_multiplier: {value: 1.0, label: varied}
            biomarkers.measured_fraction: {value: {egfr: 0.95, hba1c: 0.8, ldl: 0.8, phosphate: 0.03, lpa: 0.02, ntprobnp: 0.5, hscrp: 0.4}, label: varied}
    anticoagulant_mechanism_confounding:
      description: "Vitamin K antagonist raising calcific hazard and any anticoagulant lowering thrombosis hazard; confounding by indication; treatment started after a suspicious echo; dp-ucMGP generated from VKA exposure plus noise, with the SVD hazard depending on the marker rather than the drug, and a variant where the marker is pure noise."
      evaluates: "Whether opposite-direction effects are recovered rather than averaged; whether the post-suspicion indicator isolates reverse causation; whether the VKA coefficient shrinks toward zero when dp-ucMGP is present and the model stays quiet when the marker is noise."
      overrides:
        anticoagulation.p_af: {value: 0.45, label: varied}
        anticoagulation.p_post_suspicion_start: {value: 0.4, label: varied}
        thrombosis.multiplier: {value: 2.0, label: varied}
        vitamin_k.dp_ucmgp_substudy_fraction: {value: 0.5, label: varied}
      variants:
        marker_mediated:
          description: "The VKA signal runs through dp-ucMGP: the marker is generated from VKA exposure (and dialysis) plus noise, and the SVD hazard depends on the latent marker, not on the drug."
          overrides:
            svd_hazard.log_hr_vka_from_implant: {value: 0.0, label: varied, definition_used: "no direct drug effect; the whole VKA association is carried by the marker"}
            svd_hazard.log_hr_dp_ucmgp_per_log_unit: {value: 0.9, label: varied, definition_used: "implies a VKA log hazard ratio of about 0.9 x 0.9 = 0.81 through the marker"}
        marker_noise:
          description: "The drug acts directly on the SVD hazard and dp-ucMGP is pure noise, unrelated to VKA exposure, dialysis or SVD; the offset model must stay quiet."
          overrides:
            svd_hazard.log_hr_dp_ucmgp_per_log_unit: {value: 0.0, label: varied}
            vitamin_k.dp_ucmgp_log_rise_on_vka: {value: 0.0, label: varied}
            vitamin_k.dp_ucmgp_log_rise_dialysis: {value: 0.0, label: varied}
