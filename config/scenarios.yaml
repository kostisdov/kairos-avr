      log_hr_dp_ucmgp_per_log_unit:
        value: 0.0
        label: varied
        definition_used: "log hazard ratio on the SVD hazard per natural-log unit of latent dp-ucMGP (pmol/L) at implantation, centred on the population mean; 0 outside the marker-mediated vitamin K antagonist variant"
      log_hr_hscrp: {value: 0.0, label: assumed, definition_used: "no incremental information by design (inflammatory module)"}
      log_hr_ntprobnp_high: {value: 0.0, label: assumed, definition_used: "NT-proBNP informs competing mortality, not SVD"}
      biomarker_effect_multiplier: {value: 1.0, label: varied, definition_used: "multiplies every biomarker log hazard ratio; 1 meaningful, 0.3 weak, 0 absent"}
    phenotype:
      p_regurgitant: {value: {SAVR: 0.25, TAVR: 0.15}, label: assumed, source: "regurgitant/mixed phenotypes are a minority of SVD in surgical series (Salaun 2018)"}
    progression:
      gradient_slope_mmhg_per_year: {value: {median: 4.0, sigma: 0.5}, label: assumed, definition_used: "lognormal slope of the mean gradient after latent onset"}
      eoa_fall_fraction_per_year_at_median_slope: {value: 0.08, label: assumed}
    death_hazard:
      annual_at_age_79: {value: 0.10, label: literature_informed, source: "NOTION 10-year all-cause mortality 62.7-64.0% -> constant approximation 0.099-0.102/yr at mean age 79 (config baseline section)"}
      log_hr_per_year_of_age: {value: 0.085, label: assumed, definition_used: "Gompertz-type age gradient"}
      log_hr_dialysis: {value: 0.8, label: assumed}
      log_hr_diabetes: {value: 0.2, label: assumed}
      log_hr_af: {value: 0.3, label: assumed}
      log_hr_male: {value: 0.2, label: assumed}
      log_hr_ntprobnp_high: {value: 0.5, label: assumed, source: "NT-proBNP is prognostic for death, not SVD-specific"}
