# KAIROS scenario-config skeleton (Task 8).
#
# Every numeric value here either (a) cites a row/table from data/reference/ (built in
# Tasks 4-5) or open_data_research.md, with `source` + `definition_used` + `confidence`, or
# (b) is TODO. No value in this file was invented -- where a scenario calls for a number we
# do not have direct evidence for, that field is left `TODO` with a note on where such
# evidence could plausibly be found, per the task's explicit "do not invent values" rule.
#
# `baseline hazard parameters` below are, where noted, a CONSTANT-HAZARD APPROXIMATION
# derived from a published cumulative incidence at a fixed follow-up time via
#   annual_hazard ~= -ln(1 - cumulative_incidence) / years
# This is a standard simplifying transformation (not itself a published hazard rate), always
# labelled as such in `definition_used`, and should be replaced by the modelling engineer
# with a proper time-varying hazard fit once individual-level (real or reconstructed) event
# times are available (see src/kairos/km_reconstruct.py once a real curve is digitised,
# per docs/km_digitisation_instructions.md).

version: 0.1
generated: "2026-09-16, KAIROS Docathon data-plumbing pass"
notes: >
  This is a SKELETON for the modelling engineer to extend, not a finished parameterisation.
  Every TODO is a genuine gap, not an oversight -- see the per-field notes.

scenarios:

  baseline:
    description: >
      Central-estimate scenario, anchored to the NOTION 10-year trial (the only openly
      available head-to-head TAVI-vs-SAVR trial with both mortality and VARC-3 SVD/BVF
      reported at a long horizon) plus device-specific hemodynamic reference ranges.
    baseline_hazard:
      all_cause_mortality:
        TAVI:
          value_type: annual_hazard_constant_approx
          value: 0.0987
          source: "data/reference/published_rates.csv (study=NOTION, arm=TAVI, outcome=all-cause mortality, time_years=10, estimate_pct=62.7)"
          definition_used: "constant-hazard approx: -ln(1-0.627)/10 = 0.0987/yr; VARC-2, intention-to-treat"
          confidence: medium
        SAVR:
          value_type: annual_hazard_constant_approx
          value: 0.1023
          source: "data/reference/published_rates.csv (study=NOTION, arm=SAVR, outcome=all-cause mortality, time_years=10, estimate_pct=64.0)"
          definition_used: "constant-hazard approx: -ln(1-0.640)/10 = 0.1023/yr; VARC-2, intention-to-treat"
          confidence: medium
      severe_SVD:
        TAVI:
          value_type: annual_hazard_constant_approx
          value: 0.00151
          source: "data/reference/published_rates.csv (study=NOTION, arm=TAVI, outcome=severe SVD, time_years=10, estimate_pct=1.5)"
          definition_used: "VARC-3 haemodynamic-only variant (see NOTION methods, no EOA/DVI component); constant-hazard approx -ln(1-0.015)/10"
          confidence: medium
        SAVR:
          value_type: annual_hazard_constant_approx
          value: 0.01054
          source: "data/reference/published_rates.csv (study=NOTION, arm=SAVR, outcome=severe SVD, time_years=10, estimate_pct=10.0)"
          definition_used: "VARC-3 haemodynamic-only variant; constant-hazard approx -ln(1-0.10)/10"
          confidence: medium
    hazard_ratios:
      SVD_TAVI_vs_SAVR:
        value: 0.2
        ci_low: 0.04
        ci_high: 0.7
        source: "data/reference/published_rates.csv (NOTION severe SVD row)"
        definition_used: "VARC-3 haemodynamic-only variant, Cox regression as reported in NOTION"
        confidence: high
      BVF_TAVI_vs_SAVR:
        value: 0.7
        ci_low: 0.4
        ci_high: 1.5
        source: "data/reference/published_rates.csv (NOTION BVF row)"
        definition_used: "VARC-3 bioprosthetic valve failure"
        confidence: high
    follow_up_intensity:
      protocol_driven_annual: true
      note: "NOTION was protocol-driven yearly follow-up; real EHR-derived cohorts (our
        passport.csv) are NOT protocol-driven -- see 'sparse_informative_followup' scenario
        for the more realistic assumption to use for the actual modelling dataset."
      source: "data/raw/papers/notion_10yr_PMC10984572_fulltext.txt (Methods: 'Follow-up
        was yearly and life-long')"
      confidence: high
    missingness: "TODO -- no direct source found this session quantifying missingness
      mechanism/rate for baseline; data/derived/aggregates/prosthetic_gradient_coverage.csv
      and key_lab_availability_by_patient_year.csv give REAL observed coverage for the
      117/17-patient cohort and are a legitimate empirical starting point, but that is
      cohort-specific observed missingness, not a generative assumption -- flagging as TODO
      rather than conflating the two."
    measurement_noise:
      mean_gradient_mmHg:
        value_type: reported_SD_by_valve_and_size
        source: "data/reference/prosthetic_valve_reference_values.csv and
          data/reference/fda_ssed_hemodynamics.csv both give mean+/-SD by valve/size -- use
          the SD column directly per device rather than one pooled number here."
        confidence: high
      note: "Do not use a single pooled noise SD across all devices -- gradient variability
        differs materially by valve design (see design_class in device_table.csv); join on
        canonical_model/size_mm against prosthetic_valve_reference_values.csv or
        fda_ssed_hemodynamics.csv instead."

  high_thrombosis_TAVR:
    description: >
      Stress-test scenario: elevated valve thrombosis / HALT (hypoattenuated leaflet
      thickening) hazard specifically in the TAVR arm.
    baseline_hazard:
      valve_thrombosis:
        TAVI: "TODO -- NOTION reported ZERO clinical valve thrombosis events in EITHER arm
          at 10 years (data/reference/published_rates.csv, outcome='clinical valve
          thrombosis', both arms 0.0%), which is the opposite of useful for parameterising a
          HIGH-thrombosis stress scenario. No other source gathered this session reports a
          thrombosis incidence rate with a usable denominator/time frame. A literature
          search for subclinical leaflet thrombosis / HALT incidence (commonly discussed in
          the TAVR durability literature, e.g. imaging substudies) would need to be run
          separately -- do not populate this field from memory."
        SAVR: "TODO -- same gap."
    hazard_ratios:
      thrombosis_TAVI_vs_SAVR: "TODO -- not sourced this session."
    follow_up_intensity: "inherit baseline unless the modelling engineer wants denser
      early-window echo/CT follow-up to detect subclinical HALT specifically (common in the
      primary literature's own imaging substudy designs, e.g. Makkar et al 2015 NEJM
      'Possible Subclinical Leaflet Thrombosis in Bioprosthetic Aortic Valves' -- cited by
      title only, NOT independently verified or numerically sourced this session)."
    missingness: "TODO"
    measurement_noise: "inherit baseline"

  externally_mounted_pericardial_early_failure:
    description: >
      Stress-test scenario: elevated early SVD/reoperation hazard specific to the
      "externally mounted pericardial" design class (Trifecta/Trifecta GT/Mitroflow/Crown
      PRT), reflecting the well-documented Trifecta durability signal that led to its US
      market withdrawal.
    baseline_hazard:
      SVD_or_reoperation:
        Trifecta_vs_MagnaEase:
          hazard_ratio_reoperation_overall: 11.62
          ci: [1.47, 90.9]
          hazard_ratio_SVD: 20.815
          ci_SVD: [4.079, 106.2]
          hazard_ratio_reoperation_per_1mmHg_5yr_gradient: 1.135
          ci_gradient: [1.034, 1.244]
          source: "data/reference/published_rates.csv (study='Suzuki 2022 (Trifecta vs
            Magna Ease)') and data/raw/papers/trifecta_vs_magnaease_PMC9373186_fulltext.txt
            Table 4 (Cox regression)"
          definition_used: "trial-specific SVD definition (Rodriguez-Gabella 2017-modified:
            mTPG rise >20mmHg with EOA fall >0.6cm2), NOT VARC-3 -- see fulltext note"
          confidence: medium
          n: "Trifecta 137, CEP 133 (single-center, Japan)"
        Trifecta_vs_Perceval:
          hazard_ratio_overall_SVD: 22.4
          ci: [3.01, 166]
          hazard_ratio_initial_stage_SVD: 20.5
          ci_initial: [2.73, 153]
          source: "data/reference/published_rates.csv (study='Nardi 2026 / Perfecta study')
            and data/raw/papers/trifecta_vs_perceval_PMC13122456_fulltext.txt Table IV/V"
          definition_used: "VARC-3-style discrete staging (stages 1/2S/2SR/3), per source
            paper's methods"
          confidence: medium
          n: "Trifecta 220, Perceval 60 (single-center, Italy)"
      freedom_from_SVD_5yr:
        Trifecta: {value_pct: 89.4, source: "Suzuki 2022, see published_rates.csv", confidence: medium}
        MagnaEase: {value_pct: 100.0, source: "Suzuki 2022, see published_rates.csv", confidence: high}
      freedom_from_overall_SVD_7yr:
        Trifecta: {value_pct: 74.0, source: "Nardi 2026, see published_rates.csv", confidence: medium}
        Perceval: {value_pct: 93.0, source: "Nardi 2026, see published_rates.csv", confidence: medium}
    market_status_context: "Trifecta/Trifecta GT withdrawn from the US market (FDA
      correspondence February 2023, market withdrawal completed July 2023 per the task
      brief; manufacturer wind-down reported starting late 2022 per Nardi 2026 Discussion,
      see data/reference/device_table.csv row for Trifecta/Trifecta GT)."
    follow_up_intensity: "inherit baseline"
    missingness: "TODO"
    measurement_noise: "inherit baseline; note both source cohorts are single-center with
      wide confidence intervals (e.g. HR 95%CI up to 106-166) -- reflect this uncertainty in
      any prior distribution used for this scenario rather than treating the point estimate
      as precise."

  high_competing_mortality:
    description: >
      Elderly / high-comorbidity population where all-cause death competes heavily with
      valve-durability events -- directly relevant to KAIROS's explicit use of death as a
      competing risk.
    baseline_hazard:
      all_cause_mortality:
        TAVI: {value_pct_10yr: 62.7, source: "published_rates.csv, NOTION", confidence: high}
        SAVR: {value_pct_10yr: 64.0, source: "published_rates.csv, NOTION", confidence: high}
      context: "NOTION's own cohort (mean age ~79) is already a high-competing-mortality
        population by construction -- baseline scenario numbers above ARE this scenario's
        numbers. A genuinely HIGHER-mortality variant (e.g. an inoperable/extreme-risk
        cohort) was not sourced this session; TODO if a more extreme population is wanted."
    hazard_ratios: "inherit baseline"
    follow_up_intensity: "TODO -- informative dropout from death is a competing-risk
      analysis question for the modelling engineer, not a number this data-plumbing pass
      can supply."
    missingness: "TODO"
    measurement_noise: "inherit baseline"

  sparse_informative_followup:
    description: >
      Real-world EHR-derived follow-up (like our own passport.csv cohort) is NOT
      protocol-driven annual echocardiography -- patients return when symptomatic, after a
      new event, or per ad hoc clinical judgment, which can make missingness informative
      (i.e., NOT missing-at-random).
    baseline_hazard: "inherit baseline"
    hazard_ratios: "inherit baseline"
    follow_up_intensity:
      observed_cohort_reference: "data/derived/aggregates/prosthetic_gradient_coverage.csv
        (real, cohort-specific: n patients with >=1 prosthetic gradient and n with
        gradients in >=2 distinct years, <5-suppressed) and
        key_lab_availability_by_patient_year.csv give the ACTUAL observed sparsity pattern
        in our 117/17-patient extraction -- use as an empirical reference for how sparse
        real follow-up is, not as a generative model."
      confidence: medium
    missingness: "TODO -- quantifying whether our cohort's missingness is informative (e.g.
      whether patients with fewer follow-up echoes have systematically different SVD risk)
      requires a joint model, not a single sourced number; flagged for the modelling
      engineer."
    measurement_noise: "inherit baseline"

  opposite_direction_antithrombotic_effects:
    description: >
      Scenario where antithrombotic strategy affects TAVR and SAVR valve durability in
      OPPOSITE directions (e.g. a regimen that reduces thrombosis-related dysfunction in one
      route while not helping, or plausibly harming via bleeding-related complications, in
      the other) -- explicitly flagged in open_data_research.md section 4 as a genuine
      definitional/scientific caveat when pooling across sources.
    baseline_hazard: "TODO -- not sourced this session. The antithrombotic class exposure
      grid (data/derived/private/medication_exposure_grid.csv, aggregated in
      data/derived/aggregates/medication_class_prevalence_by_year.csv) gives real VKA/DOAC/
      antiplatelet/heparin exposure for our 17-patient labs/meds cohort, but no outcome
      linkage or effect-direction data was gathered this session -- that would require a
      dedicated literature pull (e.g. PARTNER 3's finding of more clinically significant
      leaflet thrombosis in the SAPIEN 3/TAVR arm, mentioned only qualitatively in the
      NOTION fulltext capture's Discussion citation of PARTNER 3, not independently
      numerically verified this session)."
    hazard_ratios: "TODO"
    follow_up_intensity: "inherit baseline"
    missingness: "inherit baseline"
    measurement_noise: "inherit baseline"


# =============================================================================================
# Simulation section (added 2026-09-16 for the Azure build). Parameterises the six fixed
# scenarios of the revised proposal. Every leaf is {value, label, source, definition_used}
# with label in {literature_informed, assumed, varied}; scenarios override leaves by dotted
# path. Values labelled `assumed` are prototype choices, not evidence, and the modelling
# engineer should replace them as evidence arrives. The literature skeleton above is the
# evidence base these values cite.
# =============================================================================================
simulation:
  version: 0.1
  common:
    n_patients: {value: 2500, label: assumed, definition_used: "patients per synthetic cohort"}
    followup_years_max: {value: 8, label: assumed}
    implant_year_range: {value: [2012, 2020], label: assumed, definition_used: "synthetic implant dates, uniform"}
    reference_echo_lag_days: {value: [30, 180], label: literature_informed, source: "proposal, study protocol section 2: time zero is the first adequate echo 30-180 days after implantation"}
    p_tavr: {value: 0.5, label: assumed, source: "patients_by_route.csv shows 53 surgical vs 44 transcatheter implant notes; balanced here by design"}
    age_at_implant:
      value: {SAVR: [68, 9], TAVR: [79, 7]}
      label: literature_informed
      source: "NOTION mean age ~79 (published_rates.csv); surgical cohorts younger (Salaun 2018, Johnston 2015)"
