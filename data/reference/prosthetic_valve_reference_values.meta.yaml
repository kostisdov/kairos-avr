  mean=16.23+/-5.01 EOA=1.22+/-0.22 DVI=0.42+/-0.07; CoreValve 31mm mean=9.55+/-3.44
  EOA=2.15+/-0.72 DVI=0.49+/-0.12; ViV CoreValve peak=23.48+/-12.10 mean=12.89+/-0.20
  EOA=1.62+/-0.14; ViV SAPIEN3 peak=33.93+/-10.11 mean=27.00+/-10.20 EOA=1.07+/-0.32;
  BaxterPerimount 19mm peak=32.5+/-8.5 mean=19.5+/-5.5 EOA=1.3+/-0.2; AbbottEpic 21mm
  mean=19.1+/-8.2 (low-confidence single-value row) EOA=1.0+/-0.3; HancockII 23mm
  peak=34.0+/-13.0 mean=16.6+/-8.5 EOA=1.3+/-0.4; Mitroflow 19mm peak=18.6+/-5.3
  mean=13.1+/-3.3 EOA=1.1+/-0.2; Medtronic Avalus 25mm mean=11.7+/-4.0 (low-confidence)
  EOA=1.57+/-0.31 -- all 10 confirmed by hand against pdfplumber page.extract_text() output
  for PDF pages 50-54, exact string matches, zero discrepancies found.
